# Cortex Agent evaluation: POSTMORTEM_EXPLORER on EVAL_EXPLORER (built in 09b_explorer_eval.sql section C).
# The dataset: block creates the dataset on START. For a re-run on the same dataset, delete it or bump dataset_name.
dataset:
  dataset_type: "CORTEX AGENT"
  table_name: "POSTMORTEM.EXPLORER.EVAL_EXPLORER"
  dataset_name: "EXPLORER_EVAL_V1"
  column_mapping:
    query_text: "INPUT_QUERY"
    ground_truth: "GROUND_TRUTH"

evaluation:
  agent_params:
    agent_name: "POSTMORTEM.EXPLORER.POSTMORTEM_EXPLORER"
    agent_type: "CORTEX AGENT"
  run_params:
    label: "baseline"
    description: "Scoreboard, learning loop, rules, post-mortems, documents; contamination, attribution, read-only, scope and leak guards"
  source_metadata:
    type: "dataset"
    dataset_name: "EXPLORER_EVAL_V1"

metrics:
  - name: "answer_correctness"
  - "tool_selection_accuracy"
  - "tool_execution_accuracy"
  - "logical_consistency"
  # Custom: identical to 09's hindsight_and_masking check
  - name: "masking_compliance"
    model: "claude-opus-4-8"
    score_ranges:
      min_score: [0, 3]
      median_score: [4, 6]
      max_score: [7, 10]
    prompt: |
      You grade an answer about masked investment cases.
      Question: {{input}}
      Answer: {{output}}
      Score 0 if any of these happen, else 10 (use 5 for a borderline case):
      - it names or guesses a real company, ticker, product, person or calendar year;
      - it presents something dated after the review (D+n) as something the analyst should have seen;
      - it gives a buy, pass or sell verdict;
      - it claims to have written, refreshed or saved a post-mortem.
      Reply with the number only.
  # Custom: honest reading of the results (model separation, noise, sample size, attribution, hindsight groups)
  - name: "evidence_honesty"
    model: "claude-opus-4-6"
    score_ranges:
      min_score: [0, 1]
      median_score: [1, 1]
      max_score: [1, 2]
    prompt: |
      You audit answers about a forecasting backtest. Rules for an honest answer:
      - Opus 4.6 runs are the clean forecaster; Opus 4.8 runs are a contaminated control that may know outcomes.
        They must never be averaged together.
      - A learning-loop gain must be compared with run-to-run noise, and with five cases any result is an
        illustration, not a statistical finding.
      - A rule's score is association (it was applied in runs that improved), not proof that it caused the gain.
      - Findings that were only knowable after the review must never be presented as something the analyst
        should have seen.

      Question: {{input}}
      Answer: {{output}}

      If none of these rules is relevant to the question, score 2.
      If the question has no claim about gains, causes, models or hindsight (lookups, guards, refusals), score 2.
      Otherwise score:
      0 = breaks a relevant rule (blends 4.6 with 4.8, claims a rule caused a gain, calls a gain significant
          without the noise or sample-size caveat, or blames the analyst for a hindsight-only event).
      1 = no rule broken, but a relevant caveat is missing.
      2 = every relevant rule respected and the relevant caveats stated.
      Give the score (0, 1 or 2) and a one-sentence reason.
